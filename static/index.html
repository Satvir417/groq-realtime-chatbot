<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq Real-Time AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f4f9; }
        .chat-container { max-width: 700px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #chat { border: 1px solid #ccc; padding: 15px; height: 400px; overflow-y: scroll; margin-bottom: 15px; border-radius: 5px; line-height: 1.5; background: #fafafa; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Groq Real-Time AI Chatbot</h2>
    <div id="chat"></div>
    <div class="input-group">
        <input type="text" id="messageInput" placeholder="Ask something..." autocomplete="off" />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const ws = new WebSocket("ws://" + window.location.host + "/ws/chat");
    const chatDiv = document.getElementById("chat");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    let currentAiParagraph = null;

    ws.onopen = () => {
        chatDiv.innerHTML += "<p style='color:green;'><b>System:</b> Connected to server</p>";
    };

    ws.onmessage = (event) => {
        if (event.data === "[[END_OF_STREAM]]") {
            currentAiParagraph = null;
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
            return;
        }

        if (!currentAiParagraph) {
            currentAiParagraph = document.createElement("p");
            currentAiParagraph.innerHTML = "<b>AI:</b> ";
            chatDiv.appendChild(currentAiParagraph);
        }

        currentAiParagraph.appendChild(document.createTextNode(event.data));
        chatDiv.scrollTop = chatDiv.scrollHeight;
    };

    ws.onclose = () => {
        chatDiv.innerHTML += "<p style='color:red;'><b>System:</b> Disconnected from server</p>";
    };

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text !== "" && ws.readyState === WebSocket.OPEN) {
            chatDiv.innerHTML += "<p><b>You:</b> " + text + "</p>";
            chatDiv.scrollTop = chatDiv.scrollHeight;
            
            ws.send(text);
            messageInput.value = "";
            messageInput.disabled = true;
            sendBtn.disabled = true;
        }
    }

    messageInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
